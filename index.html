<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
    <title>App Tempo</title>
  </head>
  <body>
    <div class="container">
      <div id="title">
        <h1>Previsão Tempo</h1>
      </div>
      <div class="wrapper">
        <div class="chuva"></div>
        <div class="wrapperInternal">
          <div class="location">
            <i class="fa-solid fa-location-dot" id="location_icon"></i>
            <h2 id="city">Digite a cidade</h2>
          </div>

          <div class="box-temp">
            <div class="box-temp2">
              <p id="temperature">30&deg;</p>
              <p id="clima">Nublado</p>
            </div>
            <span id="description"
              >Pancadas de chuvas cedo.Mínima de 19&deg; C.</span
            >
            <p class="max-min">Max:15&deg; | Min:7&deg;</p>
          </div>

          <div class="input-btn">
            <input id="cityValue" type="text" placeholder="Digite a cidade" />
            <button id="buscar">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </div>
        </div>
        <div class="img-menino"></div>
      </div>
    </div>
  </body>
</html>
